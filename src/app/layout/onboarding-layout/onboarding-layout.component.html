<div class="main-layout">
  @if (!store.loading()) {
    <app-wizard-header
      [currentStep]="store.step().stepNumber"
      [totalSteps]="store.step().totalSteps"
    ></app-wizard-header>
  }
  <div class="main-layout__content">
    <ion-router-outlet />
  </div>

  @if (store.step().stepNumber === 1) {
    <app-wizard-footer
      [showBack]="false"
      continueLabel="Continuer"
      continueIcon="arrow-right"
      (continueClicked)="onContinueClicked()"
    >
    </app-wizard-footer>
  } @else if (store.step().stepNumber === store.step().totalSteps) {
    <app-wizard-footer
      [showBack]="true"
      continueLabel="Terminer"
      (continueClicked)="onContinueClicked()"
      (backClicked)="onBackClicked()"
    >
    </app-wizard-footer>
  } @else {
    <app-wizard-footer
      [showBack]="true"
      continueLabel="Continuer"
      continueIcon="arrow-right"
      (continueClicked)="onContinueClicked()"
      (backClicked)="onBackClicked()"
    >
    </app-wizard-footer>
  }
</div>
