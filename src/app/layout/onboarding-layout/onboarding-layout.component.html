<div class="main-layout">
  @if (!store.loading()) {
    <app-wizard-header
      [currentStep]="store.step().stepNumber"
      [totalSteps]="store.step().totalSteps"
    ></app-wizard-header>
  }
  <div class="main-layout__content">
    <ion-router-outlet />
  </div>

  <app-wizard-footer
    [showBack]="true"
    continueLabel="Continuer"
    continueIcon="arrow-right"
    (continueClicked)="onContinueClicked()"
    (backClicked)="onBackClicked()"
  >
  </app-wizard-footer>
</div>
