<ion-content>
  <div class="content">
    <app-page-header
      eyebrow="Vos réglages"
      title="Mon profil alimentaire"
      description="Chaque changement recalcule les prochaines propositions."
    ></app-page-header>
    <app-name-field [name]="'Camille'"></app-name-field>
    <app-choice-group title="Accompagnements non aimés" subtitle="5 écartés">
      @for (item of sideDish; track $index) {
        <app-choice-chip
          [id]="item.id"
          [emoji]="item.emojy"
          [field]="item.name"
          [tone]="'danger'"
        ></app-choice-chip>
      }
    </app-choice-group>
    <app-choice-group
      title="Allergies"
      subtitle="Sélection multiple"
      tone="success"
      icon="A"
    >
      @for (item of allergies; track $index) {
        <app-choice-chip
          [id]="item.id"
          [emoji]="item.emojy"
          [field]="item.name"
          [tone]="'success'"
        ></app-choice-chip>
      }
    </app-choice-group>
    <app-choice-group
      title="Contrainte de santé"
      subtitle="Une seule option"
      tone="neutral"
      icon="C"
      layout="list"
    >
      @for (item of healthConstraints; track $index) {
        <app-radio-option-card
          [id]="item.id"
          [emoji]="item.emojy"
          [name]="item.name"
          [description]="item.description"
        ></app-radio-option-card>
      }
    </app-choice-group>
    <app-pill-button label=" Enregistrer mes préférences"></app-pill-button>
  </div>
</ion-content>
