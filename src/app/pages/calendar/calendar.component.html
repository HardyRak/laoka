<ion-content>
  <div class="content">
    <app-page-header
      eyebrow="Votre rythme"
      title="Calendrier gourmand"
      description="Une rotation calculée pour varier naturellement votre assiette."
    ></app-page-header>
    <app-month-calendar
      [month]="8"
      [year]="2026"
      [meals]="calendarMeals"
      (dayClick)="onDayClick($event)"
    ></app-month-calendar>
    <app-pill-button
      label="Recalculer avec mes préférences"
      variant="outline"
      icon="refresh"
    >
    </app-pill-button>
  </div>
</ion-content>
<app-dish-detail-modal #dishModal></app-dish-detail-modal>
