<div
  class="card"
  role="radio"
  [attr.aria-checked]="selected"
  [attr.aria-disabled]="disabled"
  tabindex="0"
  (keydown.enter)="onClick()"
  (keydown.space)="$event.preventDefault(); onClick()"
>
  <span class="card__emoji" aria-hidden="true">{{ emoji }}</span>

  <div class="card__text">
    <span class="card__name">{{ name }}</span>
    <span class="card__description">{{ description }}</span>
  </div>

  <span class="card__radio" [class.card__radio--checked]="selected">
    <span class="card__radio-dot"></span>
  </span>
</div>
