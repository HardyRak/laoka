<header class="wizard-header">
  <div class="wizard-header__top">
    <div class="wizard-header__brand">
      <span class="wizard-header__logo">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 20c8 0 12-4 12-13 0 0-9-1-12 5-2 3-2 5.5 0 8Z" />
          <path d="M6 20c1.5-3 3.5-5.5 6-7.5" />
        </svg>
      </span>
      <span class="wizard-header__title">Tandem</span>
    </div>

    <span class="wizard-header__step">{{ currentStep() }} / {{ totalSteps() }}</span>
  </div>

  <div class="wizard-header__track">
    <div class="wizard-header__fill" [style.width.%]="progress()"></div>
  </div>
</header>
