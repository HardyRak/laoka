<button
  type="button"
  class="pill-btn"
  [class.pill-btn--auto-width]="!fullWidth()"
  [disabled]="disabled()"
  (click)="onClick()"
>
  @if (icon() !== 'none' && iconPosition() === 'leading') {
    <ng-container [ngTemplateOutlet]="iconTpl"></ng-container>
  }

  <span class="pill-btn__label">{{ label() }}</span>

  @if (icon() !== 'none' && iconPosition() === 'trailing') {
    <ng-container [ngTemplateOutlet]="iconTpl"></ng-container>
  }
</button>

<ng-template #iconTpl>
  @switch (icon()) {
    @case ('check') {
      <svg
        class="pill-btn__icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M5 13L9.5 17.5L19 7"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
    @case ('refresh') {
      <svg
        class="pill-btn__icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M4 12a8 8 0 0 1 13.66-5.66L20 8"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M20 4v4h-4"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M20 12a8 8 0 0 1-13.66 5.66L4 16"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M4 20v-4h4"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
    @case ('arrow-right') {
      <svg
        class="pill-btn__icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M5 12h14M13 6l6 6-6 6"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
  }
</ng-template>
