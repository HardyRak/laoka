<nav class="tab-navigation">
  <button
    *ngFor="let tab of tabs()"
    type="button"
    class="tab-navigation__item"
    [class.tab-navigation__item--active]="tab.id === activeTabId()"
    (click)="onTabClick(tab.id)"
  >
    <span class="tab-navigation__icon">
      <ng-container [ngSwitch]="tab.id">
        <!-- Aujourd'hui : maison -->
        <svg
          *ngSwitchCase="'today'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 10.5 12 3l9 7.5" />
          <path
            d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-5.5a2 2 0 0 1 2-2v0a2 2 0 0 1 2 2V21h3.5a1 1 0 0 0 1-1V9.5"
          />
        </svg>

        <!-- Calendrier -->
        <svg
          *ngSwitchCase="'calendar'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3.5" y="5" width="17" height="16" rx="2" />
          <path d="M3.5 10h17" />
          <path d="M8 3v4" />
          <path d="M16 3v4" />
        </svg>

        <!-- Profil : personne dans un cercle -->
        <svg
          *ngSwitchCase="'profile'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9.25" />
          <circle cx="12" cy="9.75" r="2.75" />
          <path d="M6.7 18.2a5.6 5.6 0 0 1 10.6 0" />
        </svg>
      </ng-container>
    </span>

    <span class="tab-navigation__label">{{ tab.label }}</span>
  </button>
</nav>
