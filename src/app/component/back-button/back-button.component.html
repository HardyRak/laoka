<button type="button" class="back-btn" (click)="onClick()">
  <svg
    class="back-btn__icon"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <path
      d="M19 12H5M11 6l-6 6 6 6"
      stroke="currentColor"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <span class="back-btn__label">{{ label() }}</span>
</button>
