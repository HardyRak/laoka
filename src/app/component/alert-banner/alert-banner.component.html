<div class="alert">
  @if (isSuccess()) {
    <svg
      class="alert__icon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M5 13L9.5 17.5L19 7"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  } @else {
    <svg
      class="alert__icon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2" />
      <path d="M12 7.5V13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="12" cy="16.5" r="1.15" fill="currentColor" />
    </svg>
  }

  <span class="alert__message">{{ message() }}</span>
</div>
