<div class="month-calendar">
  <div class="month-calendar__header">
    <button
      type="button"
      class="month-calendar__nav"
      (click)="monthChange.emit('prev')"
      aria-label="Mois précédent"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>

    <div class="month-calendar__title">
      <h2>{{ monthLabel() }}</h2>
      <span class="month-calendar__subtitle"
        >{{ plannedDaysCount() }} Jours Planifiés</span
      >
    </div>

    <button
      type="button"
      class="month-calendar__nav"
      (click)="monthChange.emit('next')"
      aria-label="Mois suivant"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>

  <div class="month-calendar__weekdays">
    @for (label of weekdayLabels(); track $index) {
      <span>{{ label }}</span>
    }
  </div>

  <div class="month-calendar__grid">
    @for (cell of calendarCells(); track trackByCell($index, cell)) {
      <button
        type="button"
        class="month-calendar__cell"
        [class.month-calendar__cell--empty]="cell.day === null"
        [disabled]="cell.day === null"
        (click)="onCellClick(cell)"
      >
        @if (cell.day !== null) {
          <span
            class="month-calendar__day-number"
            [class.month-calendar__day-number--today]="cell.isToday"
          >
            {{ cell.day }}
          </span>

          @if (cell.meal; as meal) {
            <div
              class="month-calendar__meal"
              [style.background]="cell.color"
              [title]="meal.label"
            >
              <span class="month-calendar__meal-emoji">{{ meal.emoji }}</span>
            </div>

            <span class="month-calendar__meal-label">{{ meal.label }}</span>
          }
        }
      </button>
    }
  </div>
</div>
